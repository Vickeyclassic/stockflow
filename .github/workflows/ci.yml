name: StockFlow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: stockflow-backend/pom.xml
      - name: Backend tests (isolated H2)
        working-directory: stockflow-backend
        run: bash mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stockflow-frontend/package-lock.json
      - run: npm ci
        working-directory: stockflow-frontend
      - run: npm test
        working-directory: stockflow-frontend
      - run: npm run build
        working-directory: stockflow-frontend
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: stockflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          for name in DB_PASSWORD MYSQL_ROOT_PASSWORD JWT_SECRET; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build both production images
        run: docker compose build backend frontend
      - name: MySQL migration and HTTP smoke checks
        run: bash scripts/ci-docker-smoke.sh
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: stockflow-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_BASE_URL: http://localhost:8080
      E2E_ALLOW_WRITES: 'true'
      E2E_USERNAME: e2e.admin
      BOOTSTRAP_ADMIN_USERNAME: e2e.admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stockflow-frontend/package-lock.json
      - run: npm ci
        working-directory: stockflow-frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: stockflow-frontend
      - name: Generate isolated E2E credentials
        working-directory: stockflow-frontend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          import bcrypt from 'bcryptjs';
          const password = randomBytes(24).toString('base64');
          const values = {
            DB_PASSWORD: randomBytes(32).toString('base64'),
            MYSQL_ROOT_PASSWORD: randomBytes(32).toString('base64'),
            JWT_SECRET: randomBytes(32).toString('base64'),
            E2E_PASSWORD: password,
            BOOTSTRAP_ADMIN_PASSWORD_HASH: bcrypt.hashSync(password, 10)
          };
          for (const [name, value] of Object.entries(values)) {
            console.log(`::add-mask::${value}`);
            appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          NODE
      - name: Start production frontend, backend and MySQL
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 240
      - name: Browser smoke test
        run: npm run test:e2e
        working-directory: stockflow-frontend
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            stockflow-frontend/playwright-report/
            stockflow-frontend/test-results/
          retention-days: 7
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=100
      - name: Remove disposable E2E services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --volumes --remove-orphans
