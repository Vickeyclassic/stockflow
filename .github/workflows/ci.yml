name: StockFlow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: stockflow-backend/pom.xml
      - name: Backend tests (isolated H2)
        working-directory: stockflow-backend
        run: bash mvnw -B test
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stockflow-frontend/package-lock.json
      - run: npm ci
        working-directory: stockflow-frontend
      - run: npm run build
        working-directory: stockflow-frontend
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: stockflow-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral CI credentials
        shell: bash
        run: |
          for name in DB_PASSWORD MYSQL_ROOT_PASSWORD JWT_SECRET; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build both production images
        run: docker compose build backend frontend
      - name: MySQL migration and HTTP smoke checks
        run: bash scripts/ci-docker-smoke.sh
      - name: Container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
