spring.application.name=stockflow-backend
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/stockflow_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true
spring.jpa.open-in-view=false
spring.profiles.default=dev
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}


# Reject accidental mass assignment, including stock in normal product edits.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
